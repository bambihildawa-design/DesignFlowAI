<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: -apple-system, sans-serif; font-size: 12px; margin: 0; padding: 12px; color: #18181B; }
  h2 { font-size: 13px; margin: 0 0 8px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 8px; border: 1px solid #E7E5E2; border-radius: 6px; font-size: 12px; }
  button { width: 100%; padding: 7px; border-radius: 6px; border: none; background: #0F6E56; color: white; font-size: 12px; cursor: pointer; margin-bottom: 6px; }
  button.secondary { background: #F1EFE8; color: #18181B; }
  .card { border: 1px solid #E7E5E2; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .muted { color: #6E6E76; }
  .row { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
  <div id="setup">
    <h2>Connect to DesignFlow AI</h2>
    <input id="apiBaseUrl" placeholder="https://your-app.vercel.app" />
    <input id="token" placeholder="Plugin token (from Settings)" />
    <button id="saveSettings">Save and connect</button>
  </div>

  <div id="main" style="display:none;">
    <div class="row">
      <h2>Pending requests</h2>
      <button class="secondary" style="width:auto;padding:4px 8px;" id="refresh">Refresh</button>
    </div>
    <div id="list"><p class="muted">Loading…</p></div>
    <button class="secondary" id="editSettings" style="margin-top:8px;">Change connection</button>
  </div>

<script>
  let settings = null;

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "settings") {
      settings = msg.settings;
      if (settings) showMain(); else showSetup();
    }
    if (msg.type === "settings-saved") showMain();
    if (msg.type === "pending-list") renderList(msg.requests, msg.error);
    if (msg.type === "apply-complete") markDone(msg.requestId);
    if (msg.type === "apply-error") markError(msg.requestId, msg.error);
  };

  document.getElementById("saveSettings").onclick = () => {
    settings = {
      apiBaseUrl: document.getElementById("apiBaseUrl").value.replace(/\/$/, ""),
      token: document.getElementById("token").value,
    };
    parent.postMessage({ pluginMessage: { type: "save-settings", settings } }, "*");
  };

  document.getElementById("editSettings").onclick = showSetup;
  document.getElementById("refresh").onclick = fetchPending;

  function showSetup() {
    document.getElementById("setup").style.display = "block";
    document.getElementById("main").style.display = "none";
  }

  function showMain() {
    document.getElementById("setup").style.display = "none";
    document.getElementById("main").style.display = "block";
    fetchPending();
  }

  function fetchPending() {
    document.getElementById("list").innerHTML = "<p class='muted'>Loading…</p>";
    parent.postMessage({ pluginMessage: { type: "fetch-pending", ...settings } }, "*");
  }

  function renderList(requests, error) {
    const list = document.getElementById("list");
    if (error) { list.innerHTML = "<p class='muted'>" + error + "</p>"; return; }
    if (!requests.length) { list.innerHTML = "<p class='muted'>No pending requests right now.</p>"; return; }

    list.innerHTML = "";
    requests.forEach((r) => {
      const card = document.createElement("div");
      card.className = "card";
      card.id = "req-" + r.id;
      card.innerHTML =
        "<div style='font-weight:500;margin-bottom:2px;'>" + r.name + "</div>" +
        "<div class='muted' style='margin-bottom:8px;'>from " + (r.requesterName || "unknown") + "</div>" +
        "<button data-id='" + r.id + "'>Apply in Figma</button>";
      card.querySelector("button").onclick = () => applyRequest(r);
      list.appendChild(card);
    });
  }

  function applyRequest(request) {
    const card = document.getElementById("req-" + request.id);
    card.querySelector("button").textContent = "Applying…";
    parent.postMessage({ pluginMessage: { type: "apply-request", ...settings, request } }, "*");
  }

  function markDone(requestId) {
    const card = document.getElementById("req-" + requestId);
    if (card) card.innerHTML = "<div>Applied — check the canvas</div>";
  }

  function markError(requestId, error) {
    const card = document.getElementById("req-" + requestId);
    if (card) card.innerHTML = "<div class='muted'>Couldn't apply: " + error + "</div>";
  }
</script>
</body>
</html>
